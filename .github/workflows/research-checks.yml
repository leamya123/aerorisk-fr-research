name: Research validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile all frontend JavaScript and smoke-test dashboard
        run: node scripts/validate_dashboard.js
      - name: Rebuild policy panel
        run: python src/build_macro_panel.py
      - name: Verify generated data is committed consistently
        run: git diff --exit-code -- data/processed/central_bank_policy_monthly_v1.csv
      - name: Rebuild financing descriptive statistics
        run: python src/build_financing_summary.py
      - name: Verify BCEAO financing statistics are committed consistently
        run: git diff --exit-code -- data/processed/financing_descriptives_v1.json
      - name: Rebuild BCEAO six-year annual banking data summary
        run: python src/build_annual_lending_summary.py
      - name: Verify annual summary reproducibility
        run: git diff --exit-code -- data/processed/annual_lending_descriptives_v1.json
      - name: Rebuild continuous quarterly lending/policy panel
        run: python src/build_quarterly_panel.py
      - name: Verify quarterly panel reproduces exactly
        run: git diff --exit-code -- data/processed/quarterly_policy_lending_panel_v1.csv
      - name: Exploratory noncausal lag diagnostics
        run: python src/explore_quarterly_lags.py
      - name: Unit and data integrity tests
        run: python -m unittest discover -s tests -v
